<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    width: max-content;
  }
  .twitter-tweet { margin: 0 !important; }
  .twitter-tweet-rendered { display: block !important; margin: 0 auto !important; }
</style>
</head>
<body>
<div id="wrap">
<blockquote class="twitter-tweet" data-media-max-width="560" data-conversation="none"><p lang="en" dir="ltr">All models are now 20% off for a limited time at Nous Portal, the best way to power your Hermes Agent.<br><br>Yes, even the expensive frontier models.<br><br><a href="https://portal.nousresearch.com/manage-subscription">https://portal.nousresearch.com/manage-subscription</a></p>&mdash; Nous Research (@NousResearch) <a href="https://x.com/NousResearch/status/2080039066771337475?ref_src=twsrc%5Etfw">July 22, 2026</a></blockquote>
</div>
<script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
<script>
  // Contain-fit: show the WHOLE tweet (incl. video) with no cropping.
  // Math.min on both axes so the full card stays visible (small side margins).
  function fitToScreen() {
    var wrap = document.getElementById('wrap');
    var tweet = document.querySelector('.twitter-tweet-rendered') || document.querySelector('.twitter-tweet');
    if (!tweet) { setTimeout(fitToScreen, 200); return; }
    var tweetW = tweet.offsetWidth  || 550;
    var tweetH = tweet.offsetHeight || 700;
    var scale = Math.min(window.innerWidth / tweetW, window.innerHeight / tweetH) * 0.95;
    wrap.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fitToScreen);
  // Retry as the X widget renders/loads media (heights shift as images load)
  [400, 900, 1600, 2600, 4000].forEach(function (t) { setTimeout(fitToScreen, t); });
  // Also refit when the widget finishes rendering
  if (window.twttr && window.twttr.ready) {
    window.twttr.ready(function () { fitToScreen(); });
  }
</script>
</body>
</html>
