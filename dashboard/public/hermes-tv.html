<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes TV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Courier New', Courier, monospace; color: #38bdf8; }
  #frame { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 18px 22px; }
  #hd { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid rgba(56,189,248,0.2); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  #title { font-size: 12px; font-weight: 700; letter-spacing: 0.3em; }
  #sub { font-size: 8px; color: rgba(56,189,248,0.5); margin-top: 2px; }
  #feed { flex: 1; padding: 12px 0; overflow: hidden; }
  .item { padding: 8px 0; border-bottom: 1px solid rgba(56,189,248,0.08); display: flex; gap: 8px; }
  .item .num { color: rgba(56,189,248,0.4); font-size: 10px; min-width: 20px; }
  .item .text { font-size: 12px; color: rgba(56,189,248,0.8); line-height: 1.4; }
  .item.active { background: rgba(56,189,248,0.08); }
  .item.active .text { color: #fff; }
  #footer { padding-top: 8px; border-top: 1px solid rgba(56,189,248,0.1); font-size: 8px; color: rgba(56,189,248,0.3); letter-spacing: 0.1em; }
</style>
</head>
<body>
<div id="frame">
  <div id="hd">
    <div id="dot"></div>
    <div>
      <div id="title">HERMES TV — ACTIVITY FEED</div>
      <div id="sub">Live from your agent</div>
    </div>
  </div>
  <div id="feed">
    <div class="item active"><span class="num">01</span><span class="text">Loading activity feed…</span></div>
  </div>
  <div id="footer">HERMES AGENT · REAL-TIME BROADCAST</div>
</div>
<script>
(function () {
  const feed = document.getElementById('feed')
  const headlines = [
    'Hermes Agent initialized — Entertainment Pack loaded',
    'Dashboard backend mounted — all channels online',
    'Nous Network feed updated with latest headlines',
    'TV schedule engine running — 24hr broadcast active',
    'Dead Air channel scanning for signal…',
    'Hermes TV channel connected to activity feed',
  ]
  let idx = 0
  function render() {
    feed.innerHTML = headlines.map((h, i) =>
      `<div class="item ${i === idx ? 'active' : ''}"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="text">${h}</span></div>`
    ).join('')
  }
  render()
  setInterval(() => { idx = (idx + 1) % headlines.length; render() }, 4000)
})()
</script>
</body>
</html>
