<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nous Network</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #fff; }

  /* ── Full-bleed hero ── */
  #hero {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    transition: opacity 0.8s ease;
  }
  #hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.85) 100%);
  }

  /* ── Scanlines ── */
  #scanlines {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px);
    mix-blend-mode: multiply;
  }

  /* ── Vignette ── */
  #vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
  }

  /* ── Broadcast frame ── */
  #frame {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 18px 22px 14px;
  }

  /* ── Masthead ── */
  #masthead {
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  #logo {
    background: #FFE066; color: #000; font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900; font-size: 18px; padding: 3px 10px; letter-spacing: -0.02em;
    line-height: 1.2;
  }
  #brand {
    display: flex; flex-direction: column; gap: 1px;
  }
  #brand-title { color: #FFE066; font-size: 11px; letter-spacing: 0.32em; font-weight: 700; }
  #brand-sub { color: rgba(255,224,102,0.4); font-size: 8px; letter-spacing: 0.2em; }

  #live-badge {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
  }
  #live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3333;
    box-shadow: 0 0 8px #ff3333;
    animation: livePulse 1.2s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #live-text { color: #ff5555; font-size: 10px; font-weight: 700; letter-spacing: 0.18em; }
  #clock { color: rgba(255,224,102,0.6); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }

  /* ── Stage (center) ── */
  #stage {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    max-width: 540px; padding: 0 4px;
  }

  /* ── Now Playing strip ── */
  #now-playing {
    display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
    opacity: 0.85;
  }
  #now-playing-label {
    background: rgba(255,107,107,0.2); color: #FF6B6B; font-size: 8px;
    font-weight: 700; letter-spacing: 0.2em; padding: 3px 7px; border-radius: 2px;
    border: 1px solid rgba(255,107,107,0.3);
  }
  #now-playing-text { color: rgba(255,255,255,0.7); font-size: 10px; letter-spacing: 0.04em; }

  /* ── Headline card ── */
  #headline-card {
    position: relative;
  }
  #headline-accent {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: #FFE066; transition: background 0.5s ease;
  }
  #headline-text {
    font-size: 22px; font-weight: 900; line-height: 1.25; letter-spacing: 0.01em;
    padding-left: 18px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    transition: opacity 0.5s ease;
  }
  #headline-counter {
    margin-top: 14px; padding-left: 18px;
    color: rgba(255,255,255,0.3); font-size: 9px; letter-spacing: 0.15em;
  }

  /* ── Ticker ── */
  #ticker {
    flex-shrink: 0; display: flex; align-items: center;
    height: 26px; overflow: hidden; position: relative;
    border-top: 1px solid rgba(255,224,102,0.25);
    background: rgba(0,0,0,0.5);
  }
  #ticker-label {
    background: #FFE066; color: #000; font-weight: 900; font-size: 10px;
    padding: 0 10px; height: 100%; display: flex; align-items: center;
    letter-spacing: 0.08em; flex-shrink: 0;
  }
  #ticker-track {
    flex: 1; overflow: hidden; position: relative; height: 100%;
  }
  #ticker-text {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%);
    white-space: nowrap; font-size: 11px; color: rgba(255,230,100,0.85);
    font-weight: 600; letter-spacing: 0.04em;
    will-change: transform;
  }

  /* ── Audio control ── */
  #audio-btn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  #audio-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
  #audio-btn svg { width: 14px; height: 14px; }

  /* ── Loading state ── */
  #loading {
    position: fixed; inset: 0; z-index: 50; background: #000;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.2em;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<div id="loading">TUNING…</div>
<div id="hero"></div>
<div id="vignette"></div>
<div id="scanlines"></div>

<button id="audio-btn" title="Toggle audio" aria-label="Toggle audio">
  <svg id="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <line x1="23" y1="9" x2="17" y2="15"></line>
    <line x1="17" y1="9" x2="23" y2="15"></line>
  </svg>
</button>

<div id="frame">
  <!-- Masthead -->
  <div id="masthead">
    <div id="logo">NN</div>
    <div id="brand">
      <span id="brand-title">NOUS NETWORK</span>
      <span id="brand-sub">HERMES BROADCAST CHANNEL</span>
    </div>
    <div id="live-badge">
      <span id="clock">--:--:--</span>
      <span id="live-dot"></span>
      <span id="live-text">LIVE</span>
    </div>
  </div>

  <!-- Stage -->
  <div id="stage">
    <div id="now-playing">
      <span id="now-playing-label">ON AIR</span>
      <span id="now-playing-text">NOUS FEED BROADCAST</span>
    </div>
    <div id="headline-card">
      <div id="headline-accent"></div>
      <div id="headline-text">Loading headlines…</div>
      <div id="headline-counter">— / —</div>
    </div>
  </div>

  <!-- Ticker -->
  <div id="ticker">
    <div id="ticker-label">◈ NN</div>
    <div id="ticker-track">
      <span id="ticker-text"></span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const ACCENTS = ['#FFE066', '#FF6B6B', '#4DFFFF', '#50FF9A', '#FFAA44', '#FF88CC'];
  let feed = null;
  let idx = 0;
  let audio = null;
  let audioOn = false;

  const $ = (id) => document.getElementById(id);

  // ── Clock ──
  function tickClock() {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-US', { hour12: false });
  }
  setInterval(tickClock, 1000);
  tickClock();

  // ── Load feed ──
  async function loadFeed() {
    try {
      const r = await fetch('nous-feed.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('feed fetch ' + r.status);
      feed = await r.json();
    } catch {
      // Fallback
      feed = {
        headlines: [
          'HERMES AGENT 2.0 — DEEPER TOOL CHAINS, SAME INSTANT REASONING',
          'NOUS PROMO: NEW SHORT FILM BATCH DROPS ON THE HERMES CHANNEL',
          'HACKATHON ALERT: WEEKEND BUILD BATTLE, PRIZES POSTED FRIDAY',
        ],
        heroArt: ''
      };
    }
    render();
    $('loading').style.opacity = '0';
    setTimeout(() => { $('loading').style.display = 'none'; }, 500);
  }

  // ── Render ──
  function render() {
    const headlines = feed.headlines || [];
    if (!headlines.length) return;

    // Hero
    if (feed.heroArt) {
      $('hero').style.backgroundImage = 'url(' + feed.heroArt + ')';
    }

    // Headline
    showHeadline(0);

    // Ticker
    const tickerStr = headlines.map(h => '◈ ' + h.toUpperCase() + '   ').join('     ');
    $('ticker-text').textContent = tickerStr + tickerStr; // double for seamless loop
    startTicker();
  }

  function showHeadline(i) {
    const headlines = feed.headlines || [];
    const h = headlines[i] || '';
    $('headline-text').textContent = h.toUpperCase();
    $('headline-counter').textContent = (i + 1) + ' / ' + headlines.length;
    $('headline-accent').style.background = ACCENTS[i % ACCENTS.length];
  }

  // ── Headline rotation ──
  function rotate() {
    if (!feed || !feed.headlines) return;
    idx = (idx + 1) % feed.headlines.length;
    // fade out → swap → fade in
    $('headline-text').style.opacity = '0';
    setTimeout(() => {
      showHeadline(idx);
      $('headline-text').style.opacity = '1';
    }, 400);
  }
  setInterval(rotate, 5000);

  // ── Ticker scroll ──
  function startTicker() {
    const track = $('ticker-track');
    const text = $('ticker-text');
    let pos = 0;
    const speed = 0.6;
    function loop() {
      pos += speed;
      // reset when half the text has scrolled (since we doubled it)
      if (pos >= text.scrollWidth / 2) pos = 0;
      text.style.transform = 'translateX(' + (track.offsetWidth - pos) + 'px) translateY(-50%)';
      requestAnimationFrame(loop);
    }
    loop();
  }

  // ── Audio ──
  $('audio-btn').addEventListener('click', function () {
    if (!audio) {
      // Try to load promo audio
      audio = new Audio('nous-promo-20260823.mp3');
      audio.loop = true;
      audio.volume = 0.5;
    }
    if (audioOn) {
      audio.pause();
      audioOn = false;
      setAudioIcon(false);
    } else {
      audio.play().catch(() => {});
      audioOn = true;
      setAudioIcon(true);
    }
  });

  function setAudioIcon(on) {
    const icon = $('audio-icon');
    if (on) {
      // Speaker with sound waves
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
    } else {
      // Muted speaker
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
    }
  }

  // ── Init ──
  loadFeed();
})();
</script>
</body>
</html>
